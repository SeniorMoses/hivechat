<!DOCTYPE html>
<html>
<head>
    <title>My Chat</title>

    <style>
        body {
            font-family: Arial;
            max-width: 700px;
            margin: 40px auto;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        #messages {
            border: 1px solid #ccc;
            height: 350px;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            margin: 10px 0;
        }

        .online {
            color: green;
        }

        .offline {
            color: gray;
        }
    </style>
</head>

<body>

<h1>My Chat</h1>

<h3>Login</h3>

<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="loginStatus"></p>


<hr>

<h3>Friend</h3>

<input id="friendId" placeholder="Friend user ID">

<button onclick="checkStatus()">
    Check status
</button>

<p id="status"></p>


<h3>Messages</h3>

<div id="messages"></div>


<input
    id="message"
    placeholder="Type message..."
>

<button onclick="sendMessage()">
    Send
</button>


<script>

let token = null;
let socket = null;


async function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    const response = await fetch(
        "http://127.0.0.1:8000/login",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                username,
                password
            })
        }
    );


    const data = await response.json();


    if (!response.ok) {

        document.getElementById("loginStatus")
            .innerText = data.detail;

        return;
    }


    token = data.access_token;


    document.getElementById("loginStatus")
        .innerText = "Logged in";


    connectWebSocket();
}


function connectWebSocket() {

    socket = new WebSocket(
        `ws://127.0.0.1:8000/ws?token=${token}`
    );


    socket.onopen = () => {

        console.log(
            "WebSocket connected"
        );
    };


    socket.onmessage = (event) => {

        const data =
            JSON.parse(event.data);


        if (data.type === "message") {

            displayMessage(
                data.sender_id,
                data.content
            );
        }


        if (data.type === "message_sent") {

            displayMessage(
                "You",
                data.content
            );
        }
    };


    socket.onclose = () => {

        console.log(
            "WebSocket disconnected"
        );
    };
}


function sendMessage() {

    const receiverId =
        Number(
            document.getElementById(
                "friendId"
            ).value
        );


    const content =
        document.getElementById(
            "message"
        ).value;


    if (!socket ||
        socket.readyState !== WebSocket.OPEN) {

        alert("You are not connected");

        return;
    }


    socket.send(
        JSON.stringify({
            receiver_id: receiverId,
            content: content
        })
    );


    document.getElementById(
        "message"
    ).value = "";
}


async function checkStatus() {

    const friendId =
        Number(
            document.getElementById(
                "friendId"
            ).value
        );


    const response = await fetch(
        `http://127.0.0.1:8000/users/${friendId}/status`
    );


    const data =
        await response.json();


    const status =
        document.getElementById("status");


    if (data.online) {

        status.innerText = "● Online";
        status.className = "online";

    } else {

        status.innerText = "○ Offline";
        status.className = "offline";
    }
}


function displayMessage(
    sender,
    content
) {

    const container =
        document.getElementById(
            "messages"
        );


    const message =
        document.createElement("div");


    message.className =
        "message";


    message.innerText =
        `${sender}: ${content}`;


    container.appendChild(message);


    container.scrollTop =
        container.scrollHeight;
}

</script>

</body>
</html>
